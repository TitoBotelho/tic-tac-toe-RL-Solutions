<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo da Velha vs IA - V1</title>
  <style>
    :root {
      --deep: #01033e;
      --electric: #0033ff;
      --soft: #817efe;
      --royal: #0406e2;
      --text: #edf0ff;
      --muted: #bcc2ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Space Grotesk", "Avenir Next", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1000px 500px at 10% -10%, rgba(129, 126, 254, 0.45), transparent 60%),
        radial-gradient(800px 420px at 90% 110%, rgba(0, 51, 255, 0.4), transparent 60%),
        linear-gradient(135deg, var(--deep), #02076f 55%, var(--royal));
      display: grid;
      place-items: center;
      padding: 28px 16px;
    }

    .shell {
      width: min(980px, 100%);
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 22px;
      animation: rise 450ms ease;
    }

    .panel {
      border: 1px solid rgba(129, 126, 254, 0.4);
      border-radius: 20px;
      background: rgba(1, 3, 62, 0.62);
      backdrop-filter: blur(8px);
      box-shadow: 0 20px 40px rgba(1, 3, 62, 0.55);
      padding: 18px;
    }

    .hero {
      grid-column: 1 / -1;
      padding: 0 4px;
    }

    .tag {
      margin: 0;
      color: var(--soft);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 0.8rem;
    }

    h1 {
      margin: 6px 0 8px;
      font-size: clamp(1.8rem, 4vw, 2.7rem);
      line-height: 1.05;
    }

    .sub {
      margin: 0;
      color: var(--muted);
    }

    .board {
      width: min(440px, 88vw);
      margin: 0 auto;
      aspect-ratio: 1 / 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 10px;
    }

    .cell {
      width: 100%;
      height: 100%;
      padding: 0;
      display: grid;
      place-items: center;
      line-height: 1;
      border: 2px solid rgba(129, 126, 254, 0.45);
      border-radius: 14px;
      background: rgba(4, 6, 226, 0.18);
      color: var(--text);
      font-size: clamp(2rem, 9vw, 3.2rem);
      font-weight: 700;
      cursor: pointer;
      transition: 140ms ease;
    }

    .cell:hover:not(:disabled) {
      transform: translateY(-2px);
      background: rgba(129, 126, 254, 0.28);
    }

    .cell.x { color: #9f9dff; }
    .cell.o { color: #5e82ff; }
    .cell:disabled { opacity: 0.94; cursor: not-allowed; }

    .status {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .btn {
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      padding: 11px 14px;
      font-weight: 700;
      color: #f5f6ff;
      background: linear-gradient(120deg, var(--electric), var(--royal));
      cursor: pointer;
    }

    .hint {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 0.94rem;
    }

    @media (max-width: 860px) {
      .shell { grid-template-columns: 1fr; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="tag">Tabular RL - V1 Neon Glass</p>
      <h1>Jogo da Velha vs IA</h1>
      <p class="sub">Visual com profundidade, brilho suave e contraste alto.</p>
    </header>

    <section class="panel">
      <div id="board" class="board" role="grid" aria-label="Tabuleiro 3x3"></div>
    </section>

    <section class="panel">
      <p id="status" class="status">Sua vez (X).</p>
      <button id="resetBtn" class="btn" type="button">Nova partida</button>
      <p class="hint">Frontend pronto para conectar com a IA treinada no backend Rust.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
